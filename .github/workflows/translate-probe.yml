name: translate-probe
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/translate-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          for t in en es tr fr de it ru pl; do
            echo -n "mymemory ar|$t: "; curl -s -m 20 -G "https://api.mymemory.translated.net/get" --data-urlencode "q=نقدّم لكم رعاية طبية متكاملة في إسطنبول" --data-urlencode "langpair=ar|$t" | head -c 260; echo
          done
          echo -n "gtx: "; curl -s -m 20 -G "https://translate.googleapis.com/translate_a/single" --data-urlencode "client=gtx" --data-urlencode "sl=ar" --data-urlencode "tl=de" --data-urlencode "dt=t" --data-urlencode "q=نقدّم لكم رعاية طبية متكاملة في إسطنبول" | head -c 200; echo
