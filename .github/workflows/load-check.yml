name: load-check
on:
  workflow_dispatch:
  push:
    branches: ['load/**']
jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - name: Build (route sizes)
        run: npx next build 2>&1 | tee build.log
        env: { NEXT_TELEMETRY_DISABLED: '1' }
      - name: Start production server
        run: |
          cp -r .next/static .next/standalone/.next/ && cp -r public .next/standalone/
          PORT=3000 node .next/standalone/server.js > server.log 2>&1 &
          for i in $(seq 1 40); do curl -sf localhost:3000/ar >/dev/null && break; sleep 2; done
      - name: Bundle sizes
        run: |
          echo "== total static JS (KiB) =="; du -ck .next/static/chunks/*.js | tail -1
          echo "== biggest chunks =="; ls -S -l .next/static/chunks/*.js | head -12 | awk '{printf "%8.1f KiB  %s\n", $5/1024, $9}'
          echo "== css =="; ls -l .next/static/chunks/*.css 2>/dev/null | awk '{printf "%8.1f KiB  %s\n", $5/1024, $9}'
          echo "== public images (KiB) =="; ls -S -l public/*.jpg public/services/*.jpg 2>/dev/null | head -12 | awk '{printf "%8.1f KiB  %s\n", $5/1024, $9}'
      - name: Lighthouse details (home, mobile)
        run: |
          npx --yes lighthouse@12 "http://localhost:3000/ar" --quiet --chrome-flags="--headless=new --no-sandbox" --only-categories=performance,accessibility --output=json --output-path=lh.json >/dev/null 2>&1 || true
          node -e "
          const r=require('./lh.json');const a=r.audits;
          const lcp=a['largest-contentful-paint-element'];
          console.log('LCP element:',JSON.stringify(lcp.details&&lcp.details.items&&lcp.details.items[0]&&lcp.details.items[0].items&&lcp.details.items[0].items[0].node&&lcp.details.items[0].items[0].node.snippet));
          const ph=a['lcp-breakdown-insight']||{};console.log('LCP breakdown:',JSON.stringify(ph.details&&ph.details.items&&ph.details.items.slice&&ph.details.items.slice(0,2)).slice(0,600));
          const show=(id,n)=>{const d=a[id]&&a[id].details&&a[id].details.items;console.log('--',id,(a[id]&&a[id].displayValue)||'');(d||[]).slice(0,n).forEach(i=>console.log('   ',(i.url||i.node&&i.node.snippet||i.label||'').toString().slice(0,110),i.wastedBytes||i.totalBytes||i.wastedMs||i.duration||''));};
          show('render-blocking-resources',6);show('unused-javascript',8);show('mainthread-work-breakdown',8);show('bootup-time',8);show('uses-responsive-images',6);show('modern-image-formats',6);show('color-contrast',6);show('definition-list',3);show('long-tasks',6);show('network-requests',0);
          const nr=a['network-requests'].details.items.sort((x,y)=>y.transferSize-x.transferSize).slice(0,12);console.log('-- biggest requests');nr.forEach(i=>console.log('   ',Math.round(i.transferSize/1024)+'KiB',i.url.slice(0,100)));
          "
      - name: Load test
        run: |
          npm i --no-save autocannon@8 >/dev/null 2>&1
          node tools/loadtest.mjs http://localhost:3000
      - name: Server log tail
        if: always()
        run: tail -30 server.log || true
